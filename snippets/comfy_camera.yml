matches:
  - trigger: ":cam_portrait"
    word: true
    replace: |
      portrait camera framing with natural perspective and flattering subject-to-background separation.
  - trigger: ":cam_close"
    word: true
    replace: |
      close-up framing focused on the face and expression, with precise eye focus.
  - trigger: ":cam_wide"
    word: true
    replace: |
      wide shot showing the subject within a clearly readable environment.
  - trigger: ":cam_low"
    word: true
    replace: |
      low-angle camera position looking upward, emphasizing height, presence, and dominance.
  - trigger: ":cam_high"
    word: true
    replace: |
      high-angle camera position looking downward, revealing spatial layout and reducing subject dominance.
  - trigger: ":cam_35mm"
    word: true
    replace: |
      35mm full-frame lens perspective, moderately wide environmental portrait, natural spatial depth.
  - trigger: ":cam_85mm"
    word: true
    replace: |
      85mm portrait lens perspective, gentle facial compression, shallow depth of field, smooth background separation.
  - trigger: ":cam_film"
    word: true
    replace: |
      analog camera rendering with organic grain, gentle highlight roll-off, subtle optical imperfection.
  - trigger: ":cam_bokeh"
    word: true
    replace: |
      shallow depth of field with smooth optical bokeh and a clearly isolated focal subject.
  - trigger: ":cam_depth"
    word: true
    replace: |
      selective focus with shallow depth of field and a controlled transition from sharp subject to soft background.
  - trigger: ":cam_vertical_portrait"
    word: true
    replace: |
      Vertical 2:3 portrait framing optimized for a full subject and clean background separation.
  - trigger: ":cam_editorial_fullbody"
    word: true
    replace: |
      Full body editorial camera angle with the complete outfit visible from head to toe.
  - trigger: ":cam_threequarter_fashion"
    word: true
    replace: |
      Three-quarter fashion portrait with the face, torso, and wardrobe silhouette clearly readable.
  - trigger: ":cam_low_glamour"
    word: true
    replace: |
      Slight low angle glamour portrait emphasizing confidence and long elegant lines.
  - trigger: ":cam_symmetry_center"
    word: true
    replace: |
      Centered symmetrical framing with balanced architecture and a stable iconic pose.
  - trigger: ":cam_environment_scale"
    word: true
    replace: |
      Wide environmental framing showing the subject as a small figure inside a vast dramatic scene.
  - trigger: ":cam_cover_art"
    word: true
    replace: |
      Cover art framing with strong silhouette, clear focal point, and readable composition at thumbnail size.
  - trigger: ":cam_material_closeup"
    word: true
    replace: |
      Close material-focused portrait showing skin texture, makeup, and glossy wardrobe highlights.
  - trigger: ":cam_24mm"
    word: true
    replace: |
      24mm wide-angle lens perspective, expansive environment, pronounced spatial depth, controlled edge distortion.
  - trigger: ":cam_50mm"
    word: true
    replace: |
      50mm normal-lens perspective, natural proportions, balanced subject and environment, restrained perspective distortion.
  - trigger: ":cam_macro"
    word: true
    replace: |
      macro lens close-up, narrow focal plane, precise micro-texture, controlled magnification and background blur.
  - trigger: ":cam_aerial"
    word: true
    replace: |
      aerial top-down or oblique viewpoint, strong geometric layout, clear scale relationships, broad environmental context.
  - trigger: ":cam_overhead"
    word: true
    replace: |
      direct overhead camera angle, flat-lay spatial organization, clean object separation, graphic composition.
