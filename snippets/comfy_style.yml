    word: true
    replace: |
      photorealistic visual language, natural skin and materials, believable optics, restrained processing, physically plausible light response.
  - trigger: ":style_photo"
    word: true
    replace: |
      professional photography, realistic camera response, controlled exposure, natural depth, precise focus, polished but believable finish.
