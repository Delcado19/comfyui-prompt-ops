matches:
  - trigger: ":light_cinematic"
    word: true
    replace: |
      motivated cinematic lighting with a clear key direction, shaped shadows, controlled fill, and readable subject separation.
  - trigger: ":light_rim"
    word: true
    replace: |
      Subtle rim lighting outlines the character.
  - trigger: ":light_volumetric"
    word: true
    replace: |
      Volumetric lighting with visible light rays.
  - trigger: ":light_candle"
    word: true
    replace: |
      Warm candlelight illuminates the scene.
  - trigger: ":light_moon"
    word: true
    replace: |
      Cold moonlight creates a mysterious atmosphere.
  - trigger: ":light_dramatic"
    word: true
    replace: |
      high-contrast directional lighting with sculpted highlights, deep but readable shadows, and a strong focal hierarchy.
  - trigger: ":light_soft"
    word: true
    replace: |
      large soft-source lighting with gentle gradients, natural skin response, and low-contrast shadow transitions.
  - trigger: ":light_shadow"
    word: true
    replace: |
      deep sculpted shadows with retained texture and controlled black levels.
  - trigger: ":light_mist"
    word: true
    replace: |
      Atmospheric mist catches the light.
  - trigger: ":light_glow"
    word: true
    replace: |
      Subtle supernatural glow around the character.
  - trigger: ":light_gloss_studio"
    word: true
    replace: |
      Controlled studio strip lights creating clean glossy reflections on black wardrobe materials.
  - trigger: ":light_lowkey_latex"
    word: true
    replace: |
      Low-key fashion lighting with deep shadows and narrow bright highlights on latex surfaces.
  - trigger: ":light_stained_glass"
    word: true
    replace: |
      Colored stained-glass light spilling across stone architecture and the subject.
  - trigger: ":light_moon_mist"
    word: true
    replace: |
      Pale moonlight diffused through mist, with soft reflections and gentle blue shadows.
  - trigger: ":light_neon_rain"
    word: true
    replace: |
      Neon rain lighting with wet reflections, colored rim light, and dark urban ambience.
  - trigger: ":light_golden_pinup"
    word: true
    replace: |
      Warm golden hour glamour light with soft retro highlights and rich skin tones.
  - trigger: ":light_cold_fantasy"
    word: true
    replace: |
      Cold fantasy backlight with icy haze, pale blue shadows, and luminous atmospheric depth.
  - trigger: ":light_gallery_softbox"
    word: true
    replace: |
      Soft gallery-style lighting with smooth gradients, clean reflections, and minimal harsh shadows.
  - trigger: ":light_lowkey"
    word: true
    replace: |
      low-key lighting, restrained fill, deep tonal shadows, selective highlights, dark background separation.
  - trigger: ":light_hard_noir"
    word: true
    replace: |
      hard directional noir lighting, sharp shadow geometry, narrow highlights, strong black-and-white tonal separation.
  - trigger: ":light_window"
    word: true
    replace: |
      directional window light, soft natural falloff, gentle room bounce, realistic skin and material response.
  - trigger: ":light_overcast"
    word: true
    replace: |
      soft overcast daylight, broad diffuse illumination, low shadow contrast, natural muted color response.
  - trigger: ":light_direct_flash"
    word: true
    replace: |
      direct on-camera flash, crisp frontal illumination, hard compact shadows, bright specular response, candid editorial energy.
  - trigger: ":light_practical"
    word: true
    replace: |
      motivated practical lighting from visible lamps and fixtures, natural local contrast, believable ambient spill.
