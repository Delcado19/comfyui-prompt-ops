matches:
  - trigger: ":ctx_portrait"
    word: true
    replace: |
      portrait composition, subject clearly framed, face readable, balanced background separation.
  - trigger: ":ctx_full"
    word: true
    replace: |
      full-body composition, complete subject visible from head to toe, natural stance, balanced framing.
  - trigger: ":ctx_close"
    word: true
    replace: |
      close-up composition, face and expression dominant, fine facial detail, shallow depth of field.
  - trigger: ":ctx_wide"
    word: true
    replace: |
      wide environmental composition, subject integrated into the setting, clear spatial depth, cinematic framing.
  - trigger: ":ctx_hero"
    word: true
    replace: |
      hero composition, dominant subject presence, strong silhouette, dramatic but readable framing.
  - trigger: ":ctx_studio"
    word: true
    replace: |
      controlled studio setup, intentional background, clean subject separation, deliberate lighting.
  - trigger: ":ctx_street"
    word: true
    replace: |
      urban street setting, candid environmental detail, naturalistic perspective, lived-in atmosphere.
  - trigger: ":ctx_nature"
    word: true
    replace: |
      outdoor natural environment, organic depth, believable atmospheric perspective, environmental context.
  - trigger: ":ctx_cinematic"
    word: true
    replace: |
      cinematic scene composition, narrative staging, controlled depth, intentional light and color.
  - trigger: ":ctx_dramatic"
    word: true
    replace: |
      dramatic composition with strong visual hierarchy, tension, contrast, and a clear focal point.
  - trigger: ":ctx_editorial_fullbody"
    word: true
    replace: |
      vertical full body editorial composition, subject centered, clean readable silhouette, strong fashion posture.
  - trigger: ":ctx_seated_editorial"
    word: true
    replace: |
      seated editorial portrait, confident posture, hands and legs clearly composed, polished fashion magazine framing.
  - trigger: ":ctx_material_showcase"
    word: true
    replace: |
      material showcase composition, glossy fabric and reflective surfaces clearly visible, controlled highlights across the outfit.
  - trigger: ":ctx_gothic_portrait"
    word: true
    replace: |
      gothic portrait composition, subject framed by ornate architecture, symmetrical dark romantic mood.
  - trigger: ":ctx_environmental_fantasy"
    word: true
    replace: |
      environmental fantasy composition, small figure against a vast dramatic landscape, strong atmospheric depth.
  - trigger: ":ctx_album_cover"
    word: true
    replace: |
      album cover composition, iconic centered subject, graphic silhouette, strong negative space and readable shapes.
  - trigger: ":ctx_pinup_editorial"
    word: true
    replace: |
      adult pinup editorial composition, confident pose, tasteful glamour framing, retro fashion attitude.
  - trigger: ":ctx_close_material"
    word: true
    replace: |
      close portrait with visible makeup, skin texture, and glossy wardrobe reflections, shallow depth of field.
  - trigger: ":ctx_documentary"
    word: true
    replace: |
      documentary composition, candid unposed moment, authentic environment, observational storytelling, natural visual imperfections.
  - trigger: ":ctx_product"
    word: true
    replace: |
      commercial product composition, primary object isolated and fully readable, controlled reflections, clean background, precise surface detail.
  - trigger: ":ctx_still_life"
    word: true
    replace: |
      still-life composition, carefully arranged objects, deliberate negative space, controlled light, tactile material detail.
  - trigger: ":ctx_macro"
    word: true
    replace: |
      macro composition, tiny subject or material detail filling the frame, precise focal plane, visible micro-texture, controlled background falloff.
  - trigger: ":ctx_architecture"
    word: true
    replace: |
      architectural composition, clean structural lines, readable geometry, strong perspective, clear sense of scale and space.
