version: 1
categories:
  - id: model
    label: Model
    prefix: model
    order: 10
    snippets:
      # Model-family triggers, not per-checkpoint: one entry per installed
      # base architecture/family instead of one per specific finetune, so
      # swapping checkpoints within a family doesn't require new snippets.
      - id: zit
        trigger: :model_zit
        word: true
        text: high-fidelity Z-Image Turbo rendering, clear subject definition, coherent anatomy and perspective, precise
          materials, controlled lighting, strong prompt adherence, fine detail without artificial oversharpening.
      - id: zbase
        trigger: :model_zbase
        word: true
        text: high-fidelity Z-Image rendering with strong prompt adherence, coherent composition, natural anatomy, rich
          tonal depth, detailed materials, and flexible aesthetic range.
      - id: sdxl
        trigger: :model_sdxl
        word: true
        text: high-quality SDXL rendering, coherent composition, detailed textures, balanced lighting, clean subject
          separation, refined finish.
      - id: flux2
        trigger: :model_flux2
        word: true
        text: high-fidelity FLUX.2 rendering with clearly defined subject and action, precise object relationships,
          realistic materials, clean geometry, controlled lighting, balanced composition.
      - id: qwen_edit
        trigger: :model_qwen_edit
        word: true
        text: preserve subject identity and composition, apply only the requested edit, maintain accurate materials and
          texture continuity, keep clean boundaries, avoid unrelated changes.
      - id: wan
        trigger: :model_wan
        word: true
        text: cinematic video rendering, stable subject identity across frames, coherent body and object motion,
          consistent wardrobe and materials, natural temporal continuity, controlled camera movement.
      - id: hidream
        trigger: :model_hidream
        word: true
        text: high-fidelity HiDream rendering, coherent composition, natural anatomy, refined materials, balanced color
          and lighting, strong prompt adherence, rich controlled detail.
      - id: krea2
        trigger: :model_krea2
        word: true
        text: high-fidelity Krea 2 rendering, strong aesthetic coherence, natural light response, precise materials,
          clean composition, nuanced textures, rich but controlled detail.
